name: Repair provider timeout strategy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-provider-timeouts.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply provider failover repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/786-chat/provider-controller.ts')
          s = p.read_text()
          s = s.replace('const COMPLEX_DEEPSEEK_TIMEOUT_MS = 135_000\nconst COMPLEX_GEMINI_FALLBACK_TIMEOUT_MS = 35_000', 'const COMPLEX_PRIMARY_TIMEOUT_MS = 95_000\nconst COMPLEX_FALLBACK_TIMEOUT_MS = 75_000')
          s = s.replace('candidateModes = ["deepseek-flash", "gemini-flash"]\n  } else {', 'candidateModes = ["gemini-flash", "deepseek-flash"]\n  } else {')
          s = s.replace('? (position === 0 ? COMPLEX_DEEPSEEK_TIMEOUT_MS : COMPLEX_GEMINI_FALLBACK_TIMEOUT_MS)', '? (position === 0 ? COMPLEX_PRIMARY_TIMEOUT_MS : COMPLEX_FALLBACK_TIMEOUT_MS)')
          p.write_text(s)
          PY
      - name: Install and verify
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/786-chat/provider-controller.ts
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Improve complex provider timeout failover'
            git push
          fi
