name: Fix Pest Control Monthly Reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pest-monthly-reports.yml'

permissions:
  contents: write

jobs:
  patch-monthly-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated Pest Control branch
        uses: actions/checkout@v4
        with:
          ref: generated/22c299f8-bf65-410f-9643-92a9776dbfca/d5dc98b4-9342-4315-9-mtykpap4-5cvg6
          fetch-depth: 0

      - name: Finalize Monthly Reports layout and dialog scrolling
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/client/src/pages/AdminDashboard.tsx')
          text = path.read_text()

          # Repair the JSX comment boundary left by the first layout replacement.
          text = text.replace(
              '/* Pest Control Documents Section - Mobile Responsive */}',
              '{/* Pest Control Documents Section - Mobile Responsive */}'
          )

          # Target ONLY the Monthly Report upload dialog.
          marker = '{/* Monthly Report Upload Dialog */}'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Monthly Report Upload Dialog marker not found')

          dialog_start = text.find('<Dialog open={showMonthlyReportDialog}', pos)
          content_start = text.find('<DialogContent', dialog_start)
          content_end = text.find('>', content_start)
          if dialog_start < 0 or content_start < 0 or content_end < 0:
              raise SystemExit('Monthly Report dialog structure not found')

          old_tag = text[content_start:content_end + 1]
          new_tag = '<DialogContent className="bg-slate-800 text-white border-slate-700 w-[calc(100vw-1rem)] sm:max-w-2xl !top-2 !translate-y-0 max-h-[calc(100dvh-1rem)] overflow-y-auto overscroll-contain">'
          text = text[:content_start] + new_tag + text[content_end + 1:]

          path.write_text(text)

      - name: Validate and commit generated Pest Control fix
        run: |
          git config user.name "786.Chat Automation"
          git config user.email "actions@786.chat"
          git add generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/client/src/pages/AdminDashboard.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No further changes required"
            exit 0
          fi
          git commit -m "fix(pest-control): finalize Monthly Reports layout"
          git push origin HEAD:generated/22c299f8-bf65-410f-9643-92a9776dbfca/d5dc98b4-9342-4315-9-mtykpap4-5cvg6
