name: Configure Pest Control IoT gateway token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-pest-iot-gateway-token.yml'

permissions:
  contents: read

jobs:
  configure-gateway-token:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure encrypted gateway token and redeploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_ramDdJPbDZUAmHzZhWYHvxEt
          VERCEL_PROJECT_NAME: 786-generated-22c299f8bf65
          VERCEL_REPOSITORY_ID: '1250394192'
          TARGET_BRANCH: generated/22c299f8-bf65-410f-9643-92a9776dbfca/1d7881ab-16ad-49e3-8-muo3tke1-kc5jq
          TARGET_SHA: 2c93698ab9864adeb90e857e1b8196dc39d4ca4c
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN GitHub secret is missing"; exit 1; }

          gateway_token=$(openssl rand -hex 32)

          env_payload=$(jq -n \
            --arg key "FOODSAFETY_IOT_GATEWAY_TOKEN" \
            --arg value "$gateway_token" \
            '{key:$key,value:$value,type:"encrypted",target:["preview","production"],comment:"Managed securely for Food Safety HP2 MQTT gateway"}')

          env_status=$(curl --silent --show-error \
            -o /tmp/vercel-env-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$env_payload" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_NAME/env?upsert=true&teamId=$VERCEL_TEAM_ID")

          case "$env_status" in
            200|201) ;;
            *) echo "Vercel environment update failed with HTTP $env_status"; cat /tmp/vercel-env-response.json; exit 1 ;;
          esac
          echo "Configured FOODSAFETY_IOT_GATEWAY_TOKEN in Vercel without printing the secret."

          cat > /tmp/gateway-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoqZkHgVIMsu2M/E/TFIt
          tRAraMgoeutGWhSdNGBKtRIoABgDC0Zk+EdHVj6DIzdtZUYzgNc2IqdnH/CHi04j
          pRu8aj4NBWj5njnMGXPaL+RYMeRGI3t6v7GbsQftfdTyUZCC7KL4ePkXEm8SWA4B
          ea5HrJPbkql48Radd8Fj+ndmsVfAPu/8qtsIMTCqQJZW7qKQ8K/pzLYFvQhSKlww
          QWMItBwx9KqSl37bu8C4vGNf2NpAKhJybrhW7Eo6pl3+sbHyg6K2sk9u69JIsHFL
          H6lCNwuVVDuX64h1TdM1h0jatPtz0BifX3am9xZCv6pPlWtdCieRwBTqgPhEDMwo
          vQIDAQAB
          -----END PUBLIC KEY-----
          PEM

          gateway_pub_fingerprint=$(openssl pkey -pubin -in /tmp/gateway-public.pem -outform DER 2>/dev/null | sha256sum | awk '{print $1}')
          test "$gateway_pub_fingerprint" = "1b987ddf2d55b1e15f87843b576c26644ee4f05bc3a23b4d6264072ac84f2cdc" || {
            echo "HP2 public key fingerprint mismatch";
            exit 1;
          }
          echo "Verified HP2 public key fingerprint."

          encrypted_token=$(printf '%s' "$gateway_token" \
            | openssl pkeyutl -encrypt -pubin -inkey /tmp/gateway-public.pem \
            | base64 -w0)
          echo "ENCRYPTED_GATEWAY_TOKEN=$encrypted_token"

          deploy_payload=$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg ref "$TARGET_BRANCH" \
            --arg sha "$TARGET_SHA" \
            --argjson repoId "$VERCEL_REPOSITORY_ID" \
            '{name:$name,target:"production",gitSource:{type:"github",repoId:$repoId,ref:$ref,sha:$sha}}')

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$deploy_payload" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID")

          deployment_id=$(echo "$response" | jq -r '.id // empty')
          deployment_url=$(echo "$response" | jq -r '.url // empty')
          test -n "$deployment_id" || { echo "Vercel did not return a deployment id"; exit 1; }
          test -n "$deployment_url" || { echo "Vercel did not return a deployment URL"; exit 1; }
          echo "Triggered gateway-token deployment: $deployment_id"

          ready=""
          for attempt in $(seq 1 120); do
            status=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID")
            ready=$(echo "$status" | jq -r '.readyState // .state // empty')
            echo "Vercel state: $ready"
            case "$ready" in
              READY) break ;;
              ERROR|CANCELED) exit 1 ;;
            esac
            sleep 5
          done
          test "$ready" = "READY" || { echo "Deployment did not become READY in time"; exit 1; }

          health=$(curl --fail-with-body --silent --show-error "https://$deployment_url/api/iot/gateway/health")
          echo "Gateway health: $health"
          echo "$health" | jq -e '.status == "ok" and .provider == "Food Safety Owned IoT" and .configured == true' >/dev/null || {
            echo "Gateway token is not active in the deployed runtime";
            exit 1;
          }
          echo "Verified configured Food Safety owned-IoT gateway."
