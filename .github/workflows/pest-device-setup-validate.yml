name: Pest Device Setup Validate

on:
  push:
    branches:
      - "generated/22c299f8-bf65-410f-9643-92a9776dbfca/34e89168-bba8-4b43-9-mu7dt6wx-nac21"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/package-lock.json
      - name: Synchronize lockfile
        run: |
          if [ -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
