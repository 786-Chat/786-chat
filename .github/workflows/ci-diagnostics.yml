name: 786.Chat CI diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Capture failing suites
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          run_group() {
            name="$1"
            shift
            echo "===== $name =====" | tee "ci-diagnostics/$name.log"
            "$@" 2>&1 | tee -a "ci-diagnostics/$name.log"
            echo "exit_code=${PIPESTATUS[0]}" | tee -a "ci-diagnostics/$name.log"
          }
          run_group phase1-a node --test tests/phase1/account-security.test.mjs tests/phase1/admin-preview-storage.test.mjs tests/phase1/build-repair-loop.test.mjs tests/phase1/business-software-generation.test.mjs tests/phase1/canonical-workspace-actions.test.mjs tests/phase1/compiled-preview-contract.test.mjs tests/phase1/deployment-domains.test.mjs tests/phase1/deployment-lifecycle.test.mjs tests/phase1/generation-pipeline.test.mjs
          run_group phase1-b node --test tests/phase1/isolation-and-generation.test.mjs tests/phase1/legacy-runtime-retirement.test.mjs tests/phase1/multi-platform-generator.test.mjs tests/phase1/next-config-compatibility.test.mjs tests/phase1/premium-workspace-layout.test.mjs tests/phase1/preview-route-stability.test.mjs
          run_group phase1-c node --test tests/phase1/provider-cleanup.test.mjs tests/phase1/provider-compact-generation.test.mjs tests/phase1/provider-diagnostics.test.mjs tests/phase1/provider-failover.test.mjs
          run_group phase1-d node --test tests/phase1/routing-and-edit-preservation.test.mjs tests/phase1/single-builder-entrypoints.test.mjs tests/phase1/transactional-persistence.test.mjs tests/phase1/visual-editor.test.mjs
          run_group phase2-a bash -lc 'node --test tests/phase2/ai-*.test.mjs tests/phase2/application-*.test.mjs tests/phase2/auth-*.test.mjs tests/phase2/backend-*.test.mjs tests/phase2/batched-*.test.mjs tests/phase2/billing-*.test.mjs tests/phase2/canonical-*.test.mjs tests/phase2/contact-*.test.mjs tests/phase2/continuation-*.test.mjs tests/phase2/crm-*.test.mjs tests/phase2/crud-*.test.mjs tests/phase2/db-*.test.mjs'
          run_group phase2-b bash -lc 'node --test tests/phase2/design-*.test.mjs tests/phase2/deterministic-*.test.mjs tests/phase2/direct-*.test.mjs tests/phase2/domain-*.test.mjs tests/phase2/file-*.test.mjs tests/phase2/focused-*.test.mjs tests/phase2/full-stack-*.test.mjs tests/phase2/fullstack-*.test.mjs'
          run_group phase2-c bash -lc 'node --test tests/phase2/generated-*.test.mjs tests/phase2/generation-*.test.mjs tests/phase2/import-*.test.mjs tests/phase2/live-*.test.mjs tests/phase2/login-*.test.mjs tests/phase2/long-*.test.mjs tests/phase2/negative-*.test.mjs tests/phase2/neon-*.test.mjs tests/phase2/new-*.test.mjs'
          run_group phase2-d bash -lc 'node --test tests/phase2/persistence-*.test.mjs tests/phase2/prebuild-*.test.mjs tests/phase2/preview-*.test.mjs tests/phase2/product-*.test.mjs tests/phase2/prompt-*.test.mjs tests/phase2/provider-*.test.mjs'
          run_group phase2-f bash -lc 'node --test tests/phase2/system-*.test.mjs tests/phase2/testing-*.test.mjs tests/phase2/unified-*.test.mjs tests/phase2/validation-*.test.mjs tests/phase2/vercel-*.test.mjs'
          run_group typecheck npm run typecheck
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ci-diagnostics
          if-no-files-found: error
