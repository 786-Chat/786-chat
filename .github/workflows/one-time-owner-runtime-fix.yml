name: One-time owner runtime fix

on:
  push:
    branches:
      - fix/owner-long-prompt-runtime

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increase owner generation route duration
        shell: bash
        run: |
          set -euo pipefail
          file="app/api/786-chat/generate/route.ts"
          grep -Fq 'export const maxDuration = 180' "$file"
          sed -i 's/export const maxDuration = 180/export const maxDuration = 300/' "$file"
          grep -Fq 'export const maxDuration = 300' "$file"

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-owner-runtime-fix.yml
          git config user.name '786.Chat automation'
          git config user.email '786.chat-automation@users.noreply.github.com'
          git add app/api/786-chat/generate/route.ts .github/workflows/one-time-owner-runtime-fix.yml
          git commit -m 'fix: allow long owner generations to complete within Vercel budget'
          git push origin HEAD:fix/owner-long-prompt-runtime
