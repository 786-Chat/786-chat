name: PestControl browser render diagnostic

on:
  push:
    branches:
      - diag/pestcontrol-browser-render-20260911
    paths:
      - .github/workflows/pestcontrol-browser-render-diagnostic.yml

permissions:
  contents: read

jobs:
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/pestcontrol-pw
          cd /tmp/pestcontrol-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Render repaired Pest Control preview and assert React mounts
        env:
          PREVIEW_URL: https://786-generated-22c299f8bf65-qlugm75g4-mujeebpro.vercel.app/
        run: |
          cd /tmp/pestcontrol-pw
          cat > render.mjs <<'NODE'
          import { chromium } from 'playwright';
          const url = process.env.PREVIEW_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const failures = [];
          let pngScriptResponses = 0;
          page.on('console', (msg) => {
            const text = msg.text();
            console.log(`BROWSER_CONSOLE ${msg.type()}: ${text}`);
            if (text.includes('Failed to load module script') && text.includes('image/png')) failures.push(text);
          });
          page.on('pageerror', (err) => {
            failures.push(err.stack || err.message);
            console.log(`BROWSER_PAGEERROR: ${err.stack || err.message}`);
          });
          page.on('requestfailed', (req) => console.log(`REQUEST_FAILED: ${req.resourceType()} ${req.method()} ${req.url()} :: ${req.failure()?.errorText}`));
          page.on('response', (res) => {
            const req = res.request();
            const ct = res.headers()['content-type'] || '';
            if (req.resourceType() === 'script' || ct.includes('image/png') || ct.includes('javascript')) {
              console.log(`RESPONSE: type=${req.resourceType()} status=${res.status()} content-type=${ct} url=${res.url()}`);
            }
            if (req.resourceType() === 'script' && ct.includes('image/png')) pngScriptResponses += 1;
          });
          const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
          await page.waitForTimeout(5000);
          const root = page.locator('#root');
          const rootCount = await root.count();
          const rootHtml = rootCount ? await root.innerHTML() : '';
          const bodyText = await page.locator('body').innerText();
          console.log(`HTTP_STATUS: ${response?.status()}`);
          console.log(`PAGE_URL: ${page.url()}`);
          console.log(`TITLE: ${await page.title()}`);
          console.log(`ROOT_COUNT: ${rootCount}`);
          console.log(`ROOT_HTML_LENGTH: ${rootHtml.length}`);
          console.log(`BODY_TEXT: ${bodyText.slice(0, 8000)}`);
          console.log(`PNG_SCRIPT_RESPONSES: ${pngScriptResponses}`);
          await page.screenshot({ path: '/tmp/pestcontrol-preview.png', fullPage: true });
          if (response?.status() !== 200) failures.push(`Expected HTTP 200, got ${response?.status()}`);
          if (rootCount !== 1) failures.push(`Expected one #root, got ${rootCount}`);
          if (!rootHtml.trim()) failures.push('React root is empty');
          if (!bodyText.trim()) failures.push('Rendered body text is empty');
          if (pngScriptResponses) failures.push(`Found ${pngScriptResponses} image/png responses requested as scripts`);
          await browser.close();
          if (failures.length) {
            console.error(`ASSERTION_FAILURES: ${failures.join(' | ')}`);
            process.exitCode = 2;
          }
          NODE
          node render.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pestcontrol-browser-render-repaired
          path: /tmp/pestcontrol-preview.png
          if-no-files-found: ignore
