name: Apply build progress patch
on:
  push:
    branches: [fix/build-progress-feedback]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build-progress-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch workspace progress feedback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/786-chat/workspace.tsx')
          s = p.read_text()
          marker = '''const toneClasses = {\n  cyan: "border-cyan-300 text-cyan-300 shadow-[0_0_25px_rgba(34,211,238,.28)]",\n  violet: "border-violet-400 text-violet-300 shadow-[0_0_25px_rgba(139,92,246,.28)]",\n  blue: "border-blue-400 text-blue-300 shadow-[0_0_25px_rgba(59,130,246,.28)]",\n  emerald: "border-emerald-400 text-emerald-300 shadow-[0_0_25px_rgba(52,211,153,.28)]",\n  amber: "border-amber-300 text-amber-200 shadow-[0_0_25px_rgba(251,191,36,.28)]",\n}\n'''
          helper = marker + '''\nfunction getBuildProgress(build: BuilderBuild | null) {\n  if (!build) return { label: "Build not queued", detail: "Generate and save a project to start verification." }\n  if (build.status === "passed") return { label: "Preview ready", detail: "Verified build passed and the live preview is ready." }\n  if (build.status === "failed") return { label: "Build failed", detail: build.error_message || "The isolated build failed. Review the captured logs and retry." }\n  if (build.status === "cancelled") return { label: "Build cancelled", detail: "Verification was cancelled before completion." }\n  if (build.status === "queued") return { label: "Queued for verification", detail: "Preparing the isolated build environment." }\n\n  const logs = (build.logs || "").toLowerCase()\n  if (logs.includes("[vercel]")) return { label: "Creating preview", detail: "Build passed. Waiting for the verified Vercel preview to become ready." }\n  if (logs.includes("[runtime]")) return { label: "Preparing runtime", detail: "Build passed. Preparing the generated runtime and database namespace." }\n  if (logs.includes("[publisher]")) return { label: "Publishing preview", detail: "Build passed. Publishing the verified source and preview branch." }\n  if (logs.includes("collecting build traces") || logs.includes("finalizing page optimization")) return { label: "Finalizing build", detail: "Next.js compiled successfully. Finalizing the production build." }\n  if (logs.includes("creating an optimized production build") || logs.includes("$ npm run build")) return { label: "Building Next.js", detail: "Running the optimized production Next.js build." }\n  if (logs.includes("$ npx tsc --noemit")) return { label: "Type-checking", detail: "Dependencies installed. Checking TypeScript before the production build." }\n  if (logs.includes("$ npm install")) return { label: "Installing dependencies", detail: "Installing the generated project's dependencies in the isolated sandbox." }\n  if (logs.includes("source bundle downloaded")) return { label: "Preparing sandbox", detail: "Generated source downloaded. Starting isolated verification." }\n  return { label: "Starting verification", detail: "The isolated build runner is starting." }\n}\n'''
          if marker not in s:
              raise SystemExit('toneClasses marker not found')
          s = s.replace(marker, helper, 1)
          old = 'const currentStage = build?.status === "passed" ? 5 : build ? 4 : project ? 3 : busy ? 1 : 0\n'
          new = old + '  const buildProgress = useMemo(() => getBuildProgress(build), [build])\n'
          if old not in s:
              raise SystemExit('currentStage marker not found')
          s = s.replace(old, new, 1)
          if '}, 5_000)' not in s:
              raise SystemExit('poll marker not found')
          s = s.replace('}, 5_000)', '}, 2_000)', 1)
          old = '{stage.detail}</p>'
          new = '{index === 3 && build ? buildProgress.detail : stage.detail}</p>'
          if old not in s:
              raise SystemExit('stage detail marker not found')
          s = s.replace(old, new, 1)
          old = '{codeDirty ? "○ Unsaved code" : visualDirty ? "○ Rebuild required" : build?.status === "passed" ? "✓ Build passed" : build ? `○ Build ${build.status}` : "○ Build not queued"}'
          new = '{codeDirty ? "○ Unsaved code" : visualDirty ? "○ Rebuild required" : build?.status === "passed" ? "✓ Build passed" : build ? `○ ${buildProgress.label}` : "○ Build not queued"}'
          if old not in s:
              raise SystemExit('header build marker not found')
          s = s.replace(old, new, 1)
          old = '<h2 className="mt-4 text-[14px] font-black">{build?.status === "failed" ? "Build failed" : build ? "Building verified preview" : "Your application will appear here"}</h2>\n                        <p className="mt-2 max-w-sm text-[14px] leading-5 text-slate-500">{build?.error_message || (build ? "Preview becomes available only after the isolated Next.js build passes." : "Describe the production application you want to create.")}</p>'
          new = '<h2 className="mt-4 text-[14px] font-black">{build ? buildProgress.label : "Your application will appear here"}</h2>\n                        <p className="mt-2 max-w-sm text-[14px] leading-5 text-slate-500">{build ? buildProgress.detail : "Describe the production application you want to create."}</p>'
          if old not in s:
              raise SystemExit('preview status marker not found')
          s = s.replace(old, new, 1)
          old = '<b className="text-[14px]">{build ? `Build ${build.status}` : "No build has run"}</b>'
          new = '<b className="text-[14px]">{build ? buildProgress.label : "No build has run"}</b>'
          if old not in s:
              raise SystemExit('sandbox label marker not found')
          s = s.replace(old, new, 1)
          old = '''{build?.status === "failed"\n                        ? build.error_message || "The isolated build failed. Review the captured logs and retry."\n                        : build?.status === "passed"\n                          ? "Install, type-check and Next.js build completed successfully."\n                          : "The isolated build sandbox starts after validated files are saved."}'''
          new = '''{build\n                        ? buildProgress.detail\n                        : "The isolated build sandbox starts after validated files are saved."}'''
          if old not in s:
              raise SystemExit('sandbox detail marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify focused source changes
        run: |
          git diff --check
          npm install --ignore-scripts
          npm run build
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-build-progress-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/786-chat/workspace.tsx .github/workflows/tmp-build-progress-patch.yml
          git commit -m "fix: show live build verification progress"
          git push origin HEAD:fix/build-progress-feedback
