name: Food Safety owned IoT check

on:
  pull_request:
    paths:
      - "generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/**"
      - "services/food-safety-iot/**"
      - ".github/workflows/food-safety-owned-iot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest-control-generated-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/package-lock.json

      - name: Synchronize generated project lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install generated project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build
