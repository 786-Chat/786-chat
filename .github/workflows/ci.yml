name: 786.Chat CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run Phase 1 regression suite
        run: npm run test:phase1
      - name: Run Phase 2 regression suite
        if: always()
        run: npm run test:phase2
      - name: Run TypeScript validation
        if: always()
        run: npm run typecheck
