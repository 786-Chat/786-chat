name: One-off FoodSafety redeploy

on:
  push:
    branches:
      - ops/redeploy-foodsafety-20260909

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == '786-Chat/786-chat'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing generated-project build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"build_id":"2e370781-f342-4008-b8d8-4888c41ae654","project_id":"dd91a4bb-6bd0-4b67-9412-c452321a6452","base_url":"https://786.chat"}}' \
            https://api.github.com/repos/786-Chat/786-chat/actions/workflows/generated-project-build.yml/dispatches
          echo "FoodSafety generated-project build dispatched."
