name: Food Safety W003 firmware build

on:
  pull_request:
    paths:
      - "services/food-safety-iot/firmware/w003-bk7231n/**"
      - ".github/workflows/food-safety-w003-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/food-safety-iot/firmware/w003-bk7231n
    env:
      FS_WIFI_SSID: TEST_SSID
      FS_WIFI_PASSWORD: TEST_PASSWORD
      FS_MQTT_HOST: 192.168.1.10
      FS_MQTT_PORT: "1883"
      FS_MQTT_USERNAME: foodsafety
      FS_MQTT_PASSWORD: TEST_MQTT_PASSWORD
      FS_DEVICE_ID: FS-MOUSE-000001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.18" "scons<4.9"
      - name: Build W003 firmware
        run: pio run
      - name: Show artifacts
        run: find .pio/build -maxdepth 3 -type f \( -name "*.bin" -o -name "*.uf2" \) -printf "%p %s bytes\n"
