name: Patch FoodSafety Replit Upload Router Once

on:
  push:
    branches:
      - fix/replit-upload-router-vercel-blob-20260910
    paths:
      - .github/workflows/patch-foodsafety-upload-runtime-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and test runtime hardening
        run: |
          set -euo pipefail
          python3 scripts/patch-foodsafety-upload-runtime.py
          node --test tests/phase2/imported-replit-object-storage-runtime.test.mjs

      - name: Commit runtime code and regression test
        run: |
          set -euo pipefail
          git config user.name "786.Chat"
          git config user.email "link24.7days@gmail.com"
          git add lib/786-admin/runtime-deployment-files.ts tests/phase2/imported-replit-object-storage-runtime.test.mjs
          git commit -m "fix(import): route Replit uploads through Vercel Blob"
          git push origin HEAD
