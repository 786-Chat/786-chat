name: Patch FoodSafety Replit Upload Router Once

on:
  push:
    branches:
      - fix/replit-upload-router-vercel-blob-20260910
    paths:
      - .github/workflows/patch-foodsafety-upload-runtime-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime hardening and live smoke request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper_path = Path('lib/786-admin/runtime-deployment-files.ts')
          helper = helper_path.read_text()
          marker = '786.Chat Vercel Blob upload-router compatibility'
          if marker not in helper:
              anchor = '\nfunction prepareImportedExpressRuntime(runtimeFiles: Record<string, string>) {'
              if anchor not in helper:
                  raise SystemExit('prepareImportedExpressRuntime anchor not found')
              patch_fn = r'''
function patchImportedReplitUploadRouter(runtimeFiles: Record<string, string>) {
  const uploadsPath = "server/uploads.ts"
  let source = runtimeFiles[uploadsPath]
  if (
    !source?.includes("REPLIT_SIDECAR_ENDPOINT") ||
    !source.includes("PUBLIC_OBJECT_SEARCH_PATHS") ||
    !source.includes("async function uploadToCloudStorage") ||
    !source.includes("randomUUID")
  ) {
    return
  }

  try {
    const pkg = JSON.parse(runtimeFiles["package.json"] || "{}") as {
      dependencies?: Record<string, string>
    }
    pkg.dependencies = {
      ...(pkg.dependencies || {}),
      "@vercel/blob": pkg.dependencies?.["@vercel/blob"] || "^2.4.0",
    }
    runtimeFiles["package.json"] = `${JSON.stringify(pkg, null, 2)}\n`
  } catch {
    return
  }

  const uploadSignature =
    "async function uploadToCloudStorage(buffer: Buffer, filename: string, contentType: string): Promise<string> {\n"
  if (!source.includes(uploadSignature)) return

  source = source.replace(
    uploadSignature,
    `${uploadSignature}  // 786.Chat Vercel Blob upload-router compatibility: bypass Replit sidecar storage on Vercel.\n  if (process.env.VERCEL) {\n    const { put } = await import("@vercel/blob");\n    const objectId = randomUUID();\n    const ext = filename.split(".").pop() || "bin";\n    const pathname = \`uploads/\${objectId}.\${ext}\`;\n    await put(pathname, buffer, {\n      access: "private",\n      contentType,\n      addRandomSuffix: false,\n    });\n    return \`/objects/vercel/\${encodeURIComponent(pathname)}\`;\n  }\n`,
  )

  runtimeFiles[uploadsPath] = source
}
'''
              helper = helper.replace(anchor, '\n' + patch_fn + anchor, 1)

          call = '  patchImportedReplitUploadRouter(runtimeFiles)\n'
          if call not in helper:
              anchor = '  patchImportedReplitObjectStorage(runtimeFiles)\n'
              if anchor not in helper:
                  raise SystemExit('object storage patch call anchor not found')
              helper = helper.replace(anchor, anchor + call, 1)

          helper_path.write_text(helper)

          test_path = Path('tests/phase2/imported-replit-object-storage-runtime.test.mjs')
          test = test_path.read_text()
          if 'imported Replit uploads router is adapted to Vercel Blob at deployment time' not in test:
              test += r'''

test("imported Replit uploads router is adapted to Vercel Blob at deployment time", () => {
  assert.match(helper, /patchImportedReplitUploadRouter/)
  assert.match(helper, /server\/uploads\.ts/)
  assert.match(helper, /async function uploadToCloudStorage/)
  assert.match(helper, /Vercel Blob upload-router compatibility/)
  assert.match(helper, /return \\`\/objects\/vercel\//)
})
'''
          test_path.write_text(test)

          smoke_path = Path('.github/workflows/foodsafety-image-upload-smoke-once.yml')
          smoke = smoke_path.read_text()
          old = 'payload=$(jq -n --arg image "data:image/png;base64,$PNG_B64" \'{image:$image}\')'
          new = 'payload=$(jq -n --arg image "data:image/png;base64,$PNG_B64" --arg filename "smoke.png" \'{image:$image,filename:$filename}\')'
          if old in smoke:
              smoke = smoke.replace(old, new, 1)
          elif '--arg filename "smoke.png"' not in smoke:
              raise SystemExit('smoke payload anchor not found')
          smoke_path.write_text(smoke)
          PY

          node --test tests/phase2/imported-replit-object-storage-runtime.test.mjs

      - name: Commit patched files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "786.Chat"
          git config user.email "link24.7days@gmail.com"
          git rm .github/workflows/patch-foodsafety-upload-runtime-once.yml
          git add lib/786-admin/runtime-deployment-files.ts \
            tests/phase2/imported-replit-object-storage-runtime.test.mjs \
            .github/workflows/foodsafety-image-upload-smoke-once.yml
          git commit -m "fix(import): route Replit uploads through Vercel Blob"
          git push origin HEAD
