name: FoodSafety Queue Fresh Import Build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/foodsafety-publish-branch-isolation-once.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Queue fresh FoodSafety build from latest saved source
        env:
          RUNNER_SECRET: ${{ secrets.BUILD_RUNNER_SECRET }}
          PROJECT_ID: dd91a4bb-6bd0-4b67-9412-c452321a6452
          BASE_URL: https://786.chat
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_SECRET" || { echo "BUILD_RUNNER_SECRET is missing"; exit 1; }
          payload=$(jq -n --arg projectId "$PROJECT_ID" '{projectId:$projectId}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RUNNER_SECRET" \
            -H "x-vercel-protection-bypass: ${RUNNER_SECRET:32:32}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$BASE_URL/api/786-admin/build-runner/retry-project"
          echo "Queued a fresh FoodSafety build from the latest saved project source."
