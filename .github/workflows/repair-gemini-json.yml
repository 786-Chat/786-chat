name: Repair Gemini JSON parsing

on:
  push:
    paths:
      - '.github/repair-gemini-json.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Gemini structured output handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/786-admin/codegen.ts')
          s = p.read_text()
          old_schema = '      schema: ProjectSchema,\n'
          if old_schema in s:
              s = s.replace(old_schema, '', 1)
          old_return = '    return generateObject({ ...request, prompt })'
          new_return = '''    const textResult = await generateText({ ...request, prompt })
    return {
      object: parseDeepSeekProject(textResult.text),
      usage: textResult.usage,
    }'''
          if old_return not in s:
              raise SystemExit('Expected generateObject return not found')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/786-admin/codegen.ts
          git diff --cached --quiet || git commit -m 'Parse Gemini project JSON from text output'
          git push
