name: Patch new project dispatch

on:
  push:
    branches:
      - fix/file-level-existing-fullstack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-level-existing-fullstack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch dispatch logic
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('lib/786-chat/provider-controller.ts')
          text = controller.read_text()
          old = 'function isExplicitNewProjectRequest(payload: GeneratorPayload) { const message = requestText(payload); return /\\bnew project\\b|completely new|create (?:a |an )?new project|this is a new project/.test(message) }'
          new = 'function isExplicitNewProjectRequest(payload: GeneratorPayload) { const message = requestText(payload); return /\\bnew project\\b|completely new|create (?:a |an )?new project|this is a new project|\\b(?:create|build|develop)\\s+(?:a|an)\\s+(?:production-ready\\s+)?[^\\n]{0,140}\\b(?:application|app|website|system)\\s+called\\b/.test(message) }'
          if old not in text:
              raise SystemExit('provider new-project matcher not found')
          controller.write_text(text.replace(old, new, 1))

          route = Path('app/api/786-chat/generate/route.ts')
          text = route.read_text()
          anchor = 'function uniquePaths(paths: string[]) {\n  return Array.from(new Set(paths.filter(Boolean)))\n}\n'
          helper = anchor + '\nfunction isExplicitNewApplicationPrompt(prompt: string) {\n  const message = prompt.toLowerCase()\n  return /\\bnew project\\b|completely new|create (?:a |an )?new project|this is a new project|\\b(?:create|build|develop)\\s+(?:a|an)\\s+(?:production-ready\\s+)?[^\\n]{0,140}\\b(?:application|app|website|system)\\s+called\\b/.test(message)\n}\n'
          if anchor not in text:
              raise SystemExit('route helper anchor not found')
          text = text.replace(anchor, helper, 1)
          anchor2 = '  const prompt = String(continuationState?.prompt || payload.message || "").trim()\n  const ownerEmail = session.email.toLowerCase().trim()\n'
          replacement2 = '  const prompt = String(continuationState?.prompt || payload.message || "").trim()\n  const explicitNewApplication = isExplicitNewApplicationPrompt(prompt)\n  if (explicitNewApplication) {\n    delete payload.projectId\n    delete payload.existing\n  }\n  const ownerEmail = session.email.toLowerCase().trim()\n'
          if anchor2 not in text:
              raise SystemExit('route prompt anchor not found')
          route.write_text(text.replace(anchor2, replacement2, 1))

          test = Path('tests/phase2/new-project-dispatch.test.mjs')
          test.write_text('''import assert from "node:assert/strict"\nimport test from "node:test"\nimport { readFile } from "node:fs/promises"\n\nconst route = await readFile(new URL("../../app/api/786-chat/generate/route.ts", import.meta.url), "utf8")\nconst controller = await readFile(new URL("../../lib/786-chat/provider-controller.ts", import.meta.url), "utf8")\n\ntest("named create-app prompts are treated as fresh projects server-side", () => {\n  assert.match(route, /isExplicitNewApplicationPrompt\\(prompt\\)/)\n  assert.match(route, /delete payload\\.projectId/)\n  assert.match(route, /delete payload\\.existing/)\n  assert.match(route, /application\\|app\\|website\\|system/)\n  assert.match(controller, /application\\|app\\|website\\|system/)\n})\n\ntest("fresh named full-stack apps can reach file-level generation", () => {\n  assert.match(controller, /if \\(explicitNewProject\\) \\{ delete payload\\.projectId; delete payload\\.existing \\}/)\n  assert.match(controller, /plannedFilesFromPrompt\\(String\\(payload\\.message \\|\\| ""\\)\\)\\.length > 1/)\n})\n''')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run focused tests
        run: node --test tests/phase2/new-project-dispatch.test.mjs tests/phase2/batched-generation-completeness.test.mjs
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/786-chat/generate/route.ts lib/786-chat/provider-controller.ts tests/phase2/new-project-dispatch.test.mjs
          git commit -m "fix: route named app creation through fresh resumable generation"
          git push origin HEAD:fix/file-level-existing-fullstack
