name: FoodSafety Repair Imported Menus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/foodsafety-seed-menus-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Re-import each branch menu with category ID remapping
        shell: bash
        run: |
          set -euo pipefail
          base='https://786-generated-dd91a4bb6bd0-od4thxgle-mujeebpro.vercel.app'
          slugs=(
            amaan-pakistani-restaurant
            dhaba
            dixy-chicken-walsall-town
            emparo-peri-peri-southend
            emparo-peri-peri
            hello-mumbai
            ko-kebabish
            meat-wholesale
            mujeeb-sweets--bakers
            nandinis
            peri-peri-watford
            rayyan-pakistani-restaurant
            shiraz-afghan
            tawa-grill
            tawa-restaurant-watford
          )
          for slug in "${slugs[@]}"; do
            echo "Repairing $slug"
            response=$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --max-time 180 \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              "$base/api/reset-branch-menu/$slug")
            printf '%s\n' "$response"
            echo "$response" | grep -q '"success":true'
          done
