name: Repair missing generated routes
on:
  push:
    branches:
      - fix/repair-missing-navigation-routes
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-missing-navigation-routes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Patch validation repair
        shell: python
        run: |
          from pathlib import Path
          route = Path('app/api/786-chat/generate/route.ts')
          text = route.read_text()
          import_anchor = 'import { screenBuilderPrompt } from "@/lib/786-chat/security"\n'
          import_line = 'import { missingRouteRepairFiles } from "@/lib/786-chat/validation-repair"\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          repair_anchor = '    const requiredRepairFiles = uniquePaths([\n      ...specification.routes.map((route) =>\n'
          replacement = '    const requiredRepairFiles = uniquePaths([\n      ...missingRouteRepairFiles(validation.errors),\n      ...specification.routes.map((route) =>\n'
          if replacement not in text:
              if repair_anchor not in text:
                  raise SystemExit('repair anchor missing')
              text = text.replace(repair_anchor, replacement, 1)
          route.write_text(text)

          helper = Path('lib/786-chat/validation-repair.ts')
          helper.write_text('''export function missingRouteRepairFiles(errors: readonly string[]) {\n  const paths: string[] = []\n  for (const error of errors) {\n    const match = error.match(/(?:Missing requested route|Internal navigation points to missing route):\\s*(\\/[^\\s;,)]+)/i)\n    if (!match?.[1]) continue\n    const route = match[1].split(/[?#]/, 1)[0].replace(/\\/+$/, "") || "/"\n    if (route.startsWith("/api/")) continue\n    paths.push(route === "/" ? "app/page.tsx" : `app/${route.slice(1)}/page.tsx`)\n  }\n  return Array.from(new Set(paths))\n}\n''')

          test = Path('tests/phase2/validation-route-repair.test.mjs')
          test.write_text('''import assert from "node:assert/strict"\nimport test from "node:test"\n\nconst { missingRouteRepairFiles } = await import("../../lib/786-chat/validation-repair.ts")\n\ntest("validator-discovered missing navigation routes become repair page files", () => {\n  assert.deepEqual(missingRouteRepairFiles([\n    "Internal navigation points to missing route: /customers",\n    "Internal navigation points to missing route: /reservations",\n  ]), ["app/customers/page.tsx", "app/reservations/page.tsx"])\n})\n\ntest("requested missing routes are repaired, deduplicated, and API routes are ignored", () => {\n  assert.deepEqual(missingRouteRepairFiles([\n    "Missing requested route: /contact",\n    "Internal navigation points to missing route: /contact",\n    "Internal navigation points to missing route: /api/customers",\n  ]), ["app/contact/page.tsx"])\n})\n''')
      - name: Run focused tests
        run: node --test tests/phase2/validation-route-repair.test.mjs tests/phase2/continuation-repair-regression.test.mjs tests/phase2/new-project-dispatch.test.mjs
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit clean patch
        run: |
          rm .github/workflows/repair-missing-routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/786-chat/generate/route.ts lib/786-chat/validation-repair.ts tests/phase2/validation-route-repair.test.mjs .github/workflows/repair-missing-routes.yml
          git commit -m "fix: repair routes discovered by validation"
          git push origin HEAD:fix/repair-missing-navigation-routes
