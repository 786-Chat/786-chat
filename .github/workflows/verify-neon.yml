name: Verify Neon schema

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-2-images
    paths:
      - ".github/workflows/verify-neon.yml"
      - "sql/**"
      - "lib/786-admin/**"
      - "app/api/786-admin/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-neon.yml"
      - "sql/**"
      - "lib/786-admin/**"
      - "app/api/786-admin/**"

permissions:
  contents: read

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_builder_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admin_builder_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admin_builder_migration_test
    steps:
      - uses: actions/checkout@v4

      - name: Apply builder migrations
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/786-admin/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/786-admin/migrations/002-deployment-domains.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/786-admin/migrations/003-generation-persistence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/786-admin/migrations/004-build-repair-loop.sql

      - name: Verify deployment-domain contract
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.admin_project_domains') IS NULL THEN
              RAISE EXCEPTION 'admin_project_domains was not created';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'admin_project_domains'
                AND column_name = 'dns_status'
            ) THEN
              RAISE EXCEPTION 'admin_project_domains.dns_status is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'admin_project_domains'
                AND column_name = 'ssl_status'
            ) THEN
              RAISE EXCEPTION 'admin_project_domains.ssl_status is missing';
            END IF;

            IF to_regclass('public.builder_generation_jobs') IS NULL THEN
              RAISE EXCEPTION 'builder_generation_jobs was not created';
            END IF;

            IF to_regclass('public.admin_project_revisions') IS NULL THEN
              RAISE EXCEPTION 'admin_project_revisions was not created';
            END IF;

            IF to_regclass('public.admin_project_builds') IS NULL THEN
              RAISE EXCEPTION 'admin_project_builds was not created';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'admin_project_builds'
                AND column_name = 'repair_attempt'
            ) THEN
              RAISE EXCEPTION 'admin_project_builds.repair_attempt is missing';
            END IF;
          END $$;
          SQL

  verify-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_READONLY }}
    steps:
      - name: Validate secret configuration
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL_READONLY is not configured."
            exit 1
          fi

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify connection and permissions
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database() AS database_name,
                 current_user AS database_role,
                 has_database_privilege(current_user, current_database(), 'CONNECT') AS can_connect;

          SELECT has_schema_privilege(current_user, 'public', 'USAGE') AS public_schema_usage;
          SQL

      - name: Verify required admin-builder tables
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            missing_tables text;
          BEGIN
            SELECT string_agg(required_table, ', ' ORDER BY required_table)
            INTO missing_tables
            FROM (VALUES
              ('admin_projects'),
              ('admin_project_files'),
              ('admin_project_messages')
            ) AS required(required_table)
            WHERE to_regclass('public.' || required_table) IS NULL;

            IF missing_tables IS NOT NULL THEN
              RAISE EXCEPTION 'Missing required tables: %', missing_tables;
            END IF;
          END $$;

          SELECT table_name
          FROM information_schema.tables
          WHERE table_schema = 'public'
            AND table_name IN ('admin_projects', 'admin_project_files', 'admin_project_messages')
          ORDER BY table_name;
          SQL

      - name: Verify required columns and indexes
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT table_name, column_name, data_type, is_nullable
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name IN ('admin_projects', 'admin_project_files', 'admin_project_messages')
          ORDER BY table_name, ordinal_position;

          SELECT schemaname, tablename, indexname
          FROM pg_indexes
          WHERE schemaname = 'public'
            AND tablename IN ('admin_projects', 'admin_project_files', 'admin_project_messages')
          ORDER BY tablename, indexname;
          SQL

      - name: Verify read-only access
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            has_table_privilege(current_user, 'public.admin_projects', 'SELECT') AS projects_select,
            has_table_privilege(current_user, 'public.admin_projects', 'INSERT') AS projects_insert,
            has_table_privilege(current_user, 'public.admin_projects', 'UPDATE') AS projects_update,
            has_table_privilege(current_user, 'public.admin_projects', 'DELETE') AS projects_delete;
          SQL
