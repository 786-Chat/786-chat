name: Fix frontend-only validation

on:
  push:
    paths:
      - '.github/workflows/fix-frontend-only-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Repair specification and route validation
        run: |
          python - <<'PY'
          from pathlib import Path

          spec_path = Path('lib/786-chat/specification.ts')
          text = spec_path.read_text()

          old = '''  const positivePrompt = withoutNegativeRequirements(prompt)\n  const systemBlueprint = selectSystemBlueprint(positivePrompt)\n  const editIntent = classifyApplicationEdit(positivePrompt)'''
          new = '''  const positivePrompt = withoutNegativeRequirements(prompt)\n  const frontendOnlyRequested = /\\bfrontend[- ]only\\b|\\b(?:no|without|do not create|don't create)\\s+(?:a\\s+)?(?:database|backend|api|server)(?:s)?\\b/i.test(prompt)\n  const systemBlueprint = frontendOnlyRequested ? null : selectSystemBlueprint(positivePrompt)\n  const editIntent = classifyApplicationEdit(positivePrompt)'''
          if old not in text:
              raise SystemExit('specification insertion point not found')
          text = text.replace(old, new, 1)

          old = '''    ...(/\\bapi|backend|server|saas|crm|erp|upload|attachment\\b/i.test(positivePrompt) || deliveryEmailRequested || functionalAuthRequested || systemBlueprint ? ["backend"] : []),\n    ...(/\\bdatabase|postgres|neon|relational|upload|attachment\\b/i.test(positivePrompt) || functionalAuthRequested || systemBlueprint ? ["database"] : []),'''
          new = '''    ...(!frontendOnlyRequested && (/\\bapi|backend|server|saas|crm|erp|upload|attachment\\b/i.test(positivePrompt) || deliveryEmailRequested || functionalAuthRequested || systemBlueprint) ? ["backend"] : []),\n    ...(!frontendOnlyRequested && (/\\bdatabase|postgres|neon|relational|upload|attachment\\b/i.test(positivePrompt) || functionalAuthRequested || systemBlueprint) ? ["database"] : []),'''
          if old not in text:
              raise SystemExit('platform inference block not found')
          text = text.replace(old, new, 1)

          old = '''    backendRequirements: unique(matches(positivePrompt, ['''
          new = '''    backendRequirements: frontendOnlyRequested ? [] : unique(matches(positivePrompt, ['''
          if old not in text:
              raise SystemExit('backend requirements block not found')
          text = text.replace(old, new, 1)

          old = '''      [/\\bupload|attachment|file storage|blob\\b/i, "file-storage"],\n    ])),'''
          new = '''      [/\\bupload|attachment|file storage|blob\\b/i, "file-storage"],\n    ])),'''
          # no-op marker keeps syntax check explicit
          if old not in text:
              raise SystemExit('backend requirements closing block not found')

          spec_path.write_text(text)

          validation_path = Path('lib/786-chat/validation.ts')
          text = validation_path.read_text()
          old = '''        const href = match[1].trim()\n        if (!href.startsWith("/") || href.startsWith("//")) continue'''
          new = '''        const href = match[1].trim()\n        // Template/dynamic hrefs such as `/${route}` cannot be validated as\n        // literal Next.js routes during static generation validation.\n        if (/\\$\\{|[{}]/.test(href)) continue\n        if (!href.startsWith("/") || href.startsWith("//")) continue'''
          if old not in text:
              raise SystemExit('internal href validation block not found')
          text = text.replace(old, new, 1)
          validation_path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run route validation tests
        run: npm run test:phase2 --if-present

      - name: Build production app
        run: npm run build

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/786-chat/specification.ts lib/786-chat/validation.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix frontend-only and dynamic route validation"
          git push
