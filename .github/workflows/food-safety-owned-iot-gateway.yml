name: Food Safety owned IoT gateway check

on:
  pull_request:
    paths:
      - "services/food-safety-iot/**"
      - "docs/food-safety-owned-iot/**"
      - ".github/workflows/food-safety-owned-iot-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/food-safety-iot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
