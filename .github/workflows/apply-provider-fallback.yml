name: Apply provider fallback

on:
  push:
    branches:
      - fix/restore-provider-fallback
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-provider-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Restore sequential provider fallback
        run: python scripts/restore-provider-fallback.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused provider tests
        run: node --test tests/phase1/provider-failover.test.mjs tests/phase2/direct-provider-routing.test.mjs tests/phase2/provider-execution-budget.test.mjs tests/phase2/live-builder-runtime-hotfix.test.mjs
      - name: Build production application
        run: pnpm build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/786-admin/codegen.ts
          git diff --cached --quiet || git commit -m "Restore Gemini Flash fallback when DeepSeek fails"
          git push origin HEAD:fix/restore-provider-fallback
