name: Fix codegen provider mode

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-codegen-provider-mode.py
      - .github/workflows/fix-codegen-provider-mode.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply repair
        run: python scripts/fix-codegen-provider-mode.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/786-admin/codegen.ts
          git diff --cached --quiet || git commit -m "Honor Gemini fallback in code generation"
          git pull --rebase origin main
          git push origin HEAD:main
