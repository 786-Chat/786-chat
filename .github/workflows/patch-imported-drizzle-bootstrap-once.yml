name: Patch imported Drizzle bootstrap once

on:
  push:
    branches:
      - fix/imported-drizzle-schema-bootstrap-20260911
    paths:
      - .github/workflows/patch-imported-drizzle-bootstrap-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/imported-drizzle-schema-bootstrap-20260911
          fetch-depth: 0
      - name: Apply safe empty-database Drizzle bootstrap
        run: python3 scripts/patch-imported-drizzle-bootstrap.py
      - name: Run focused phase 2 test
        run: node --test tests/phase2/imported-runtime-database-auth.test.mjs
      - name: Commit safeguard
        run: |
          git config user.name "786.Chat"
          git config user.email "link24.7days@gmail.com"
          git add lib/786-admin/imported-runtime-finalizer.ts tests/phase2/imported-runtime-database-auth.test.mjs
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix(import): bootstrap empty Drizzle databases safely"
          git push origin HEAD:fix/imported-drizzle-schema-bootstrap-20260911
