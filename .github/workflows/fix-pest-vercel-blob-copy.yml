name: Deploy Pest Control Mobile Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pest-vercel-blob-copy.yml'

permissions:
  contents: read

jobs:
  deploy-pest-mobile-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy exact repaired Pest Control commit to generated Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_ramDdJPbDZUAmHzZhWYHvxEt
          VERCEL_PROJECT_NAME: 786-generated-22c299f8bf65
          VERCEL_REPOSITORY_ID: '1250394192'
          TARGET_BRANCH: generated/22c299f8-bf65-410f-9643-92a9776dbfca/34e89168-bba8-4b43-9-mu7dt6wx-nac21
          TARGET_SHA: fd547e0f0027cc4b049fdc403ce0ffa244d57dea
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN GitHub secret is missing"; exit 1; }

          payload=$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg ref "$TARGET_BRANCH" \
            --arg sha "$TARGET_SHA" \
            --argjson repoId "$VERCEL_REPOSITORY_ID" \
            '{name:$name,target:"staging",gitSource:{type:"github",repoId:$repoId,ref:$ref,sha:$sha}}')

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID")

          deployment_id=$(echo "$response" | jq -r '.id // empty')
          deployment_url=$(echo "$response" | jq -r '.url // empty')
          test -n "$deployment_id" || { echo "Vercel did not return a deployment id"; echo "$response"; exit 1; }
          echo "Triggered Pest Control mobile-fix deployment: $deployment_id"
          echo "Deployment URL: https://$deployment_url"

          ready=""
          for attempt in $(seq 1 90); do
            status=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID")
            ready=$(echo "$status" | jq -r '.readyState // .state // empty')
            echo "Vercel state: $ready"
            case "$ready" in
              READY) break ;;
              ERROR|CANCELED) echo "$status"; exit 1 ;;
            esac
            sleep 5
          done

          test "$ready" = "READY" || { echo "Deployment did not become READY in time"; exit 1; }
          echo "Verified READY deployment for $TARGET_SHA"
