name: Fix Pest Control Vercel Blob Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pest-vercel-blob-copy.yml'

permissions:
  contents: write

jobs:
  patch-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pest Control generated branch
        uses: actions/checkout@v4
        with:
          ref: generated/22c299f8-bf65-410f-9643-92a9776dbfca/d5dc98b4-9342-4315-9-mtykpap4-5cvg6
          fetch-depth: 0

      - name: Repair Vercel Blob copy-to-branch path
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/server/routes.ts')
          text = path.read_text()

          sentinel = "const vercelBlobPath = (objectFile as any).__vercelBlobPath;"
          marker = "const writeStream = fs.createWriteStream(tempPath);"

          if sentinel in text:
            print('Vercel Blob copy path already repaired')
          else:
            marker_pos = text.find(marker)
            if marker_pos < 0:
              raise SystemExit('Photo copy write-stream marker not found')

            tail = text[marker_pos + len(marker):]
            pattern = re.compile(
              r"(?P<indent>^[ \t]*)await new Promise\(\(resolve, reject\) => \{\s*"
              r"objectFile\.createReadStream\(\)\s*"
              r"\.pipe\(writeStream\)\s*"
              r"\.on\('finish', resolve\)\s*"
              r"\.on\('error', reject\);\s*"
              r"\}\);",
              re.MULTILINE,
            )
            match = pattern.search(tail)
            if not match:
              raise SystemExit('Legacy Object Storage copy block not found after photo marker')

            indent = match.group('indent')
            unit = '  '
            replacement_lines = [
              "const vercelBlobPath = (objectFile as any).__vercelBlobPath;",
              "if (process.env.VERCEL && vercelBlobPath) {",
              "  const { get } = await import('@vercel/blob');",
              "  const blobResult = await get(vercelBlobPath, { access: 'private' });",
              "  if (!blobResult || blobResult.statusCode !== 200) {",
              "    throw new Error(`Unable to read Vercel Blob ${vercelBlobPath}`);",
              "  }",
              "  const { Readable } = await import('node:stream');",
              "  await new Promise((resolve, reject) => {",
              "    const source = Readable.fromWeb(blobResult.stream as any);",
              "    source.on('error', reject);",
              "    writeStream.on('finish', resolve);",
              "    writeStream.on('error', reject);",
              "    source.pipe(writeStream);",
              "  });",
              "} else {",
              "  await new Promise((resolve, reject) => {",
              "    objectFile.createReadStream()",
              "      .pipe(writeStream)",
              "      .on('finish', resolve)",
              "      .on('error', reject);",
              "  });",
              "}",
            ]
            replacement = '\n'.join(indent + line for line in replacement_lines)
            repaired_tail = tail[:match.start()] + replacement + tail[match.end():]
            text = text[:marker_pos + len(marker)] + repaired_tail
            path.write_text(text)
            print('Patched Vercel Blob copy path')

      - name: Commit generated project repair
        run: |
          git config user.name "786.Chat Automation"
          git config user.email "actions@786.chat"
          git add generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/server/routes.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated source change required"
          else
            git commit -m "fix(pest-control): support Vercel Blob photo copy"
            git push origin HEAD:generated/22c299f8-bf65-410f-9643-92a9776dbfca/d5dc98b4-9342-4315-9-mtykpap4-5cvg6
          fi

      - name: Queue clean Pest Control rebuild
        env:
          RUNNER_SECRET: ${{ secrets.BUILD_RUNNER_SECRET }}
          PROJECT_ID: 22c299f8-bf65-410f-9643-92a9776dbfca
          BASE_URL: https://786.chat
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_SECRET" || { echo "BUILD_RUNNER_SECRET is missing"; exit 1; }
          payload=$(jq -n --arg projectId "$PROJECT_ID" '{projectId:$projectId}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RUNNER_SECRET" \
            -H "x-vercel-protection-bypass: ${RUNNER_SECRET:32:32}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$BASE_URL/api/786-admin/build-runner/retry-project"
          echo "Queued Pest Control rebuild with Vercel Blob repair."
