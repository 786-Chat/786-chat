name: Finalize Pest Control Live Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pest-vercel-blob-copy.yml'

permissions:
  contents: write

jobs:
  patch-live-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout live Pest Control generated branch
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH='generated/22c299f8-bf65-410f-9643-92a9776dbfca/0ae18329-440c-47e3-8-mtz3rq37-04992'
          git fetch origin "$TARGET_BRANCH:$TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git checkout --detach "$TARGET_BRANCH"

      - name: Remove leftover Replit development banner
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/client/index.html')
          html = index.read_text()
          cleaned = re.sub(
            r'\s*<!--\s*This is a replit script.*?-->\s*<script[^>]+src=["\']https://replit\.com/public/js/replit-dev-banner\.js["\'][^>]*></script>\s*',
            '\n',
            html,
            flags=re.DOTALL | re.IGNORECASE,
          )
          if cleaned == html and 'replit-dev-banner.js' in html:
            cleaned = re.sub(
              r'\s*<script[^>]+replit-dev-banner\.js[^>]*></script>\s*',
              '\n',
              html,
              flags=re.IGNORECASE,
            )
          if 'replit-dev-banner.js' in cleaned:
            raise SystemExit('Replit development banner still present after cleanup')
          if cleaned != html:
            index.write_text(cleaned)
            print('Removed Replit development banner from live Pest Control source')
          else:
            print('Replit development banner already absent')

      - name: Commit and push live cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "786.Chat Automation"
          git config user.email "actions@786.chat"
          git add generated-projects/22c299f8-bf65-410f-9643-92a9776dbfca/client/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No live source change required"
            exit 0
          fi
          git commit -m "fix(pest-control): remove leftover Replit banner"
          git push origin "HEAD:${TARGET_BRANCH}"
