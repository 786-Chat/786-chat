name: Apply schema validation repair fix

on:
  push:
    branches:
      - fix/focused-schema-validation-repair
    paths:
      - .github/workflows/apply-schema-repair-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/focused-schema-validation-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply focused schema repair patch
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/786-chat/generate/route.ts')
          text = route.read_text()
          old = '''    const focusedSystemRepair = validation.errors.every((error) =>
      /tenant guard|tenant ownership|API mutations|operational pages|workflow evidence|CRUD/i.test(error)
    )'''
          new = '''    const focusedSystemRepair = validation.errors.every((error) =>
      /Database schema is missing entities|Tenant schema must reference companies|tenant guard|tenant ownership|API mutations|operational pages|workflow evidence|CRUD|Internal navigation points to missing route|Missing requested route/i.test(error)
    )'''
          if old not in text:
              raise SystemExit('focusedSystemRepair block not found')
          text = text.replace(old, new, 1)
          anchor = '      "For tenant security, lib/server/tenant.ts must explicitly reject a missing or mismatched companyId with a forbidden/unauthorized error.",\n'
          insert = anchor + '      "Schema repair is authoritative: sql/schema.sql must CREATE TABLE for every entity named in any Database schema is missing entities validation error; do not omit inferred entities during a genuine blueprint repair.",\n      "For tenant-scoped systems, sql/schema.sql must define companies, add company_id REFERENCES companies(id) to tenant-owned business tables, and CREATE INDEX entries that include company_id.",\n'
          if anchor not in text:
              raise SystemExit('tenant repair anchor not found')
          text = text.replace(anchor, insert, 1)
          route.write_text(text)

          blueprints = Path('lib/786-chat/system-blueprints.ts')
          text = blueprints.read_text()
          old_alias = 'aliases: ["restaurant pos", "pos system", "point of sale", "restaurant management"],'
          new_alias = 'aliases: ["restaurant pos", "pos system", "point of sale", "restaurant point of sale"],'
          if old_alias not in text:
              raise SystemExit('restaurant POS alias block not found')
          blueprints.write_text(text.replace(old_alias, new_alias, 1))

          test = Path('tests/phase2/schema-validation-repair.test.mjs')
          test.write_text('''import assert from "node:assert/strict"\nimport test from "node:test"\nimport { readFile } from "node:fs/promises"\n\nconst route = await readFile(new URL("../../app/api/786-chat/generate/route.ts", import.meta.url), "utf8")\nconst blueprints = await readFile(new URL("../../lib/786-chat/system-blueprints.ts", import.meta.url), "utf8")\n\ntest("schema and tenant validation failures use focused repair", () => {\n  assert.match(route, /Database schema is missing entities/)\n  assert.match(route, /Tenant schema must reference companies/)\n  assert.match(route, /Schema repair is authoritative/)\n  assert.match(route, /company_id REFERENCES companies\\(id\\)/)\n})\n\ntest("generic restaurant management does not force Restaurant POS blueprint", () => {\n  assert.doesNotMatch(blueprints, /aliases: \\[\"restaurant pos\", \"pos system\", \"point of sale\", \"restaurant management\"\\]/)\n  assert.match(blueprints, /aliases: \\[\"restaurant pos\", \"pos system\", \"point of sale\", \"restaurant point of sale\"\\]/)\n})\n''')
          PY
      - run: node --test tests/phase2/schema-validation-repair.test.mjs tests/phase2/generation-route-auth.test.mjs tests/phase2/batched-generation-completeness.test.mjs
      - run: npm run build
      - name: Commit verified patch
        run: |
          rm .github/workflows/apply-schema-repair-fix.yml
          git config user.name "786-Chat"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/786-chat/generate/route.ts lib/786-chat/system-blueprints.ts tests/phase2/schema-validation-repair.test.mjs .github/workflows/apply-schema-repair-fix.yml
          git commit -m "fix: focus schema validation repair"
          git push origin HEAD:fix/focused-schema-validation-repair
