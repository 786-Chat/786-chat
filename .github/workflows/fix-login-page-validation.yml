name: Fix login page validation

on:
  push:
    branches:
      - fix/login-page-validation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-page-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Apply repair
        run: python scripts/fix-login-page-validation.py
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run focused validation tests
        run: node --test tests/phase2/login-page-ui-validation.test.mjs
      - name: Build production application
        run: pnpm build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/786-chat/specification.ts
          git diff --cached --quiet || git commit -m "Do not require a backend for a visual login page"
          git push origin HEAD:fix/login-page-validation
