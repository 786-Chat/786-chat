name: Deploy Pest Control owned IoT gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pest-owned-iot-gateway.yml'

permissions:
  contents: read

jobs:
  deploy-pest-owned-iot-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy exact repaired Pest Control commit
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_ramDdJPbDZUAmHzZhWYHvxEt
          VERCEL_PROJECT_NAME: 786-generated-22c299f8bf65
          VERCEL_REPOSITORY_ID: '1250394192'
          TARGET_BRANCH: generated/22c299f8-bf65-410f-9643-92a9776dbfca/e9d4321f-c144-4a08-9-muo09lns-l206e
          TARGET_SHA: 926b45062fc99622fe9036bc9f904d9a63220a93
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN GitHub secret is missing"; exit 1; }

          payload=$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg ref "$TARGET_BRANCH" \
            --arg sha "$TARGET_SHA" \
            --argjson repoId "$VERCEL_REPOSITORY_ID" \
            '{name:$name,target:"staging",gitSource:{type:"github",repoId:$repoId,ref:$ref,sha:$sha}}')

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID")

          deployment_id=$(echo "$response" | jq -r '.id // empty')
          deployment_url=$(echo "$response" | jq -r '.url // empty')
          test -n "$deployment_id" || { echo "Vercel did not return a deployment id"; echo "$response"; exit 1; }
          test -n "$deployment_url" || { echo "Vercel did not return a deployment URL"; echo "$response"; exit 1; }
          echo "Triggered Pest Control owned-IoT deployment: $deployment_id"
          echo "Deployment URL: https://$deployment_url"

          ready=""
          for attempt in $(seq 1 120); do
            status=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID")
            ready=$(echo "$status" | jq -r '.readyState // .state // empty')
            echo "Vercel state: $ready"
            case "$ready" in
              READY) break ;;
              ERROR|CANCELED) echo "$status"; exit 1 ;;
            esac
            sleep 5
          done

          test "$ready" = "READY" || { echo "Deployment did not become READY in time"; exit 1; }

          health=$(curl --fail-with-body --silent --show-error "https://$deployment_url/api/iot/gateway/health")
          echo "Gateway health: $health"
          echo "$health" | jq -e '.status == "ok" and .provider == "Food Safety Owned IoT"' >/dev/null || {
            echo "Owned IoT gateway health endpoint did not return the expected JSON";
            exit 1;
          }

          configured=$(echo "$health" | jq -r '.configured')
          echo "Gateway token configured: $configured"
          echo "Verified READY Pest Control deployment with owned-IoT gateway route."
